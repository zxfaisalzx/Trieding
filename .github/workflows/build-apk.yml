name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iltizam.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iltizam.apk \
            --title "التزام - آخر نسخة (${{ github.run_number }})" \
            --notes "حمّل iltizam.apk من جوالك وثبّته. النسخة رقم ${{ github.run_number }}." \
            --target ${{ github.sha }}
